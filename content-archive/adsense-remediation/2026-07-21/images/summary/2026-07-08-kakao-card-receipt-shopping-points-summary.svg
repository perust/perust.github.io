<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">카카오 카드영수증 확인 흐름</title>
  <desc id="desc">카카오톡 카드영수증 연결 전 확인할 항목을 요약한 lentoludens summary 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="112" r="150" fill="#facc15" opacity="0.18"/>
  <circle cx="165" cy="535" r="190" fill="#38bdf8" opacity="0.14"/>

  <text x="70" y="86" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#fde68a">lentoludens summary</text>
  <text x="70" y="148" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="52" font-weight="900" fill="#ffffff">카카오 카드영수증</text>
  <text x="70" y="205" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="38" font-weight="800" fill="#dbeafe">연결 전 확인할 4가지</text>

  <g filter="url(#shadow)">
    <rect x="70" y="260" width="250" height="220" rx="24" fill="#ffffff" opacity="0.96"/>
    <rect x="350" y="260" width="250" height="220" rx="24" fill="#ffffff" opacity="0.96"/>
    <rect x="630" y="260" width="250" height="220" rx="24" fill="#ffffff" opacity="0.96"/>
    <rect x="910" y="260" width="220" height="220" rx="24" fill="#ffffff" opacity="0.96"/>
  </g>

  <text x="100" y="318" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#111827">1. 연결 범위</text>
  <text x="100" y="366" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">카드사별</text>
  <text x="100" y="402" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">알림·영수증</text>

  <text x="380" y="318" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#111827">2. 혜택 조건</text>
  <text x="380" y="366" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">포인트 지급</text>
  <text x="380" y="402" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">한도·기간</text>

  <text x="660" y="318" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#111827">3. 알림 정리</text>
  <text x="660" y="366" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">채널 추가</text>
  <text x="660" y="402" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">수신 피로도</text>

  <text x="940" y="318" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="900" fill="#111827">4. 정산</text>
  <text x="940" y="366" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">공유 전</text>
  <text x="940" y="402" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#334155">개인정보 확인</text>

  <path d="M298 370 H350" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
  <path d="M578 370 H630" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
  <path d="M858 370 H910" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>

  <text x="70" y="560" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#c7d2fe">혜택보다 먼저: 어떤 카드 정보가 어디로 오고, 누구와 공유되는지 확인</text>
</svg>
