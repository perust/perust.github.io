<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">내일로 기차여행 준비</title>
<desc id="desc">가격, 좌석지정, 코스 선택을 한 번에 정리한 요약 이미지</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#082f49"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/></filter>
  <style><![CDATA[
    .font { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Nanum Gothic', 'Malgun Gothic', sans-serif; }
    .title { font-size: 62px; font-weight: 850; fill: #f8fafc; letter-spacing: -1.7px; }
    .sub { font-size: 28px; font-weight: 550; fill: #cbd5e1; }
    .label { font-size: 24px; font-weight: 780; fill: #f8fafc; }
    .small { font-size: 19px; font-weight: 650; fill: #93c5fd; }
    .cardText { font-size: 25px; font-weight: 760; fill: #e0f2fe; }
  ]]></style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1040" cy="120" r="240" fill="#38bdf8" opacity="0.18"/>
<circle cx="100" cy="650" r="230" fill="#22c55e" opacity="0.13"/>
<rect x="70" y="64" width="1060" height="592" rx="42" fill="#07111f" opacity="0.82" filter="url(#shadow)" stroke="#164e63"/>
<text x="112" y="136" class="font small">lentoludens travel guide</text>
<text x="112" y="210" class="font title">내일로 기차여행 준비</text>
<text x="112" y="292" class="font sub">가격·좌석지정·코스를 먼저 잡으면 여행이 편해집니다</text>

<path d="M150 520 C260 440 360 455 470 520 S690 585 805 520 S980 455 1060 520" fill="none" stroke="url(#rail)" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
<path d="M155 558 L1060 558" stroke="#334155" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
<path d="M210 558 L170 618 M310 558 L270 618 M410 558 L370 618 M510 558 L470 618 M610 558 L570 618 M710 558 L670 618 M810 558 L770 618 M910 558 L870 618 M1010 558 L970 618" stroke="#1f2937" stroke-width="7" stroke-linecap="round" opacity="0.95"/>

<rect x="130" y="360" width="260" height="118" rx="28" fill="#0f172a" stroke="#1d4ed8"/>
<text x="260" y="411" text-anchor="middle" class="font cardText">선택 3일권</text>
<text x="260" y="450" text-anchor="middle" class="font small">7일 안에서 3일 사용</text>

<rect x="470" y="360" width="260" height="118" rx="28" fill="#0f172a" stroke="#0891b2"/>
<text x="600" y="411" text-anchor="middle" class="font cardText">KTX 좌석 2회</text>
<text x="600" y="450" text-anchor="middle" class="font small">장거리 구간에 배치</text>

<rect x="810" y="360" width="260" height="118" rx="28" fill="#0f172a" stroke="#16a34a"/>
<text x="940" y="411" text-anchor="middle" class="font cardText">일반열차 연결</text>
<text x="940" y="450" text-anchor="middle" class="font small">도시 사이 이동 최적화</text>
</svg>
