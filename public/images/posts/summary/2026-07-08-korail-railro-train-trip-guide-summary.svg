<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">내일로 기차여행 준비</title>
<desc id="desc">선택 3일권, KTX 좌석 2회, 일반열차 연결을 한 번에 정리한 요약 이미지</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#082f49"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/></filter>
  <style><![CDATA[
    .font { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Nanum Gothic', 'Malgun Gothic', sans-serif; }
    .title { font-size: 64px; font-weight: 850; fill: #f8fafc; letter-spacing: -1.7px; }
    .sub { font-size: 32px; font-weight: 550; fill: #cbd5e1; }
    .brand { font-size: 22px; font-weight: 650; fill: #93c5fd; }
    .rowKey { font-size: 42px; font-weight: 800; fill: #e0f2fe; }
    .rowDetail { font-size: 34px; font-weight: 600; fill: #93c5fd; }
  ]]></style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1040" cy="120" r="240" fill="#38bdf8" opacity="0.18"/>
<circle cx="100" cy="650" r="230" fill="#22c55e" opacity="0.13"/>
<rect x="70" y="64" width="1060" height="592" rx="42" fill="#07111f" opacity="0.82" filter="url(#shadow)" stroke="#164e63"/>
<text x="112" y="128" class="font brand">lentoludens travel guide</text>
<text x="112" y="198" class="font title">내일로 기차여행 준비</text>
<text x="112" y="254" class="font sub">가격·좌석지정·코스를 먼저 잡으면 여행이 편해집니다</text>

<rect x="112" y="280" width="976" height="108" rx="22" fill="#0f172a" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="152" cy="310" r="8" fill="#3b82f6"/>
<text x="184" y="326" class="font rowKey">선택 3일권</text>
<text x="184" y="368" class="font rowDetail">7일 안에서 3일 사용</text>

<rect x="112" y="398" width="976" height="108" rx="22" fill="#0f172a" stroke="#0891b2" stroke-width="2.5"/>
<circle cx="152" cy="428" r="8" fill="#22d3ee"/>
<text x="184" y="444" class="font rowKey">KTX 좌석 2회</text>
<text x="184" y="486" class="font rowDetail">장거리 구간에 배치</text>

<rect x="112" y="516" width="976" height="108" rx="22" fill="#0f172a" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="152" cy="546" r="8" fill="#4ade80"/>
<text x="184" y="562" class="font rowKey">일반열차 연결</text>
<text x="184" y="604" class="font rowDetail">도시 사이 이동 최적화</text>

<path d="M112 640 L1088 640" stroke="url(#rail)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
</svg>
