<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">자동이체 계좌 정리</title>
  <desc id="desc">계좌 목록, 자동이체 조회, 변경 확인을 정리한 lentoludens summary 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style><![CDATA[
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Nanum Gothic', 'Malgun Gothic', sans-serif; }
      .brand { font-size: 22px; font-weight: 700; fill: #a7f3d0; }
      .title { font-size: 62px; font-weight: 850; fill: #f8fafc; letter-spacing: -1.7px; }
      .sub { font-size: 30px; font-weight: 560; fill: #cbd5e1; }
      .num { font-size: 28px; font-weight: 850; fill: #0f172a; }
      .cardTitle { font-size: 34px; font-weight: 800; fill: #ecfeff; letter-spacing: -0.7px; }
      .cardText { font-size: 24px; font-weight: 600; fill: #bae6fd; }
    ]]></style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1030" cy="118" r="250" fill="#38bdf8" opacity="0.16"/>
  <circle cx="90" cy="645" r="260" fill="#34d399" opacity="0.16"/>
  <rect x="72" y="64" width="1056" height="592" rx="42" fill="#07111f" opacity="0.84" stroke="#155e75" stroke-width="2" filter="url(#shadow)"/>

  <text x="112" y="130" class="font brand">lentoludens summary</text>
  <text x="112" y="206" class="font title">자동이체 계좌 정리</text>
  <text x="112" y="266" class="font sub">은행 갈아타기 전, 출금 흐름부터 확인</text>

  <rect x="112" y="320" width="300" height="224" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="156" cy="368" r="24" fill="#38bdf8"/>
  <text x="148" y="378" class="font num">1</text>
  <text x="144" y="430" class="font cardTitle">계좌 목록</text>
  <text x="144" y="476" class="font cardText">급여·생활비·오래된</text>
  <text x="144" y="512" class="font cardText">계좌를 먼저 구분</text>

  <rect x="450" y="320" width="300" height="224" rx="28" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="494" cy="368" r="24" fill="#22d3ee"/>
  <text x="486" y="378" class="font num">2</text>
  <text x="482" y="430" class="font cardTitle">자동이체</text>
  <text x="482" y="476" class="font cardText">금액·출금일·서비스명</text>
  <text x="482" y="512" class="font cardText">빠짐없이 확인</text>

  <rect x="788" y="320" width="300" height="224" rx="28" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="832" cy="368" r="24" fill="#34d399"/>
  <text x="824" y="378" class="font num">3</text>
  <text x="820" y="430" class="font cardTitle">변경 확인</text>
  <text x="820" y="476" class="font cardText">첫 출금 성공 후</text>
  <text x="820" y="512" class="font cardText">오래된 계좌 정리</text>

  <path d="M412 432 H450 M750 432 H788" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <path d="M112 594 H1088" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
</svg>
