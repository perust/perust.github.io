<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Hostinger VPS에서 Hermes Agent 운영</title>
<desc id="desc">VPS 위에 Hermes Agent, 모델, 도구, 메신저 게이트웨이를 연결하는 구조</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/></filter>
  <style><![CDATA[
    .font { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Nanum Gothic', 'Malgun Gothic', sans-serif; }
    .title { font-size: 54px; font-weight: 800; fill: #f8fafc; letter-spacing: -1.2px; }
    .sub { font-size: 25px; font-weight: 500; fill: #cbd5e1; }
    .label { font-size: 25px; font-weight: 760; fill: #f8fafc; }
    .small { font-size: 18px; font-weight: 650; fill: #94a3b8; }
    .tiny { font-size: 17px; font-weight: 650; fill: #cbd5e1; }
  ]]></style>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1045" cy="105" r="230" fill="#38bdf8" opacity="0.18"/>
<circle cx="96" cy="650" r="220" fill="#22c55e" opacity="0.12"/>
<rect x="70" y="64" width="1060" height="592" rx="42" fill="#0b1220" opacity="0.82" filter="url(#shadow)" stroke="#1f2937"/>
<text x="112" y="136" class="font small" fill="#38bdf8">lentoludens summary</text>
<text x="112" y="203" class="font title">Hostinger 원클릭 Hermes Agent</text>
<text x="112" y="284" class="font sub">Application Catalog로 개인 AI 작업 서버 시작</text>

<rect x="122" y="365" width="205" height="150" rx="26" fill="url(#card)" stroke="#334155"/>
<circle cx="164" cy="410" r="22" fill="#38bdf8"/>
<text x="164" y="419" text-anchor="middle" class="font label">1</text>
<text x="186" y="414" class="font label">Hostinger VPS</text>
<text x="150" y="465" class="font tiny">Ubuntu 서버</text>
<text x="150" y="494" class="font tiny">SSH 접속</text>

<path d="M 345 440 L 417 440" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<path d="M 400 427 L 417 440 L 400 453" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="438" y="365" width="205" height="150" rx="26" fill="url(#card)" stroke="#334155"/>
<circle cx="480" cy="410" r="22" fill="#22c55e"/>
<text x="480" y="419" text-anchor="middle" class="font label">2</text>
<text x="502" y="414" class="font label">Hermes 설치</text>
<text x="466" y="465" class="font tiny">hermes setup</text>
<text x="466" y="494" class="font tiny">model / tools</text>

<path d="M 661 440 L 733 440" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<path d="M 716 427 L 733 440 L 716 453" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="754" y="365" width="205" height="150" rx="26" fill="url(#card)" stroke="#334155"/>
<circle cx="796" cy="410" r="22" fill="#f97316"/>
<text x="796" y="419" text-anchor="middle" class="font label">3</text>
<text x="818" y="414" class="font label">Gateway</text>
<text x="782" y="465" class="font tiny">Slack · Discord</text>
<text x="782" y="494" class="font tiny">Cron 자동화</text>

<path d="M 541 515 C 541 570 705 570 705 515" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
<text x="623" y="604" text-anchor="middle" class="font small">모델 + 도구 + 메모리 + 스킬이 VPS 위에서 계속 작동</text>
