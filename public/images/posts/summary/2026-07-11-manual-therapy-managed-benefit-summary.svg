<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">도수치료 관리급여 핵심 요약</title>
  <desc id="desc">1회 4만3850원, 본인부담률 95%, 주 2회 연 15회 원칙, 예외 연 24회</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.55" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#31507a" flood-opacity="0.16"/>
    </filter>
    <style>
      .brand{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:24px;font-weight:700;fill:#516070;letter-spacing:.04em}
      .title{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:58px;font-weight:800;fill:#10233f;letter-spacing:-1.8px}
      .sub{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:28px;font-weight:600;fill:#42526b;letter-spacing:-.6px}
      .card-title{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:24px;font-weight:800;fill:#26415f;letter-spacing:-.4px}
      .card-num{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:38px;font-weight:900;fill:#0b63ce;letter-spacing:-1px}
      .note{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:19px;font-weight:600;fill:#64748b;letter-spacing:-.2px}
      .pill{font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:20px;font-weight:800;fill:#ffffff;letter-spacing:-.2px}
    </style>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <circle cx="1012" cy="118" r="156" fill="#dcecff" opacity="0.8"/>
  <circle cx="178" cy="550" r="190" fill="#e7ddff" opacity="0.62"/>
  <g transform="translate(72 64)">
    <text class="brand" x="0" y="0">lentoludens · Money check</text>
    <text class="title" x="0" y="86">도수치료 관리급여</text>
    <text class="sub" x="0" y="132">7월 1일부터 가격·횟수·보험 기준이 함께 바뀜</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="245" width="320" height="210" rx="28" fill="#ffffff"/>
    <rect x="102" y="275" width="92" height="34" rx="17" fill="#0b63ce"/>
    <text class="pill" x="126" y="299">가격</text>
    <text class="card-num" x="102" y="360">4만3850원</text>
    <text class="card-title" x="102" y="405">1회 동일 수가</text>
    <text class="note" x="102" y="438">기존 평균 약 11만 원 언급</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="245" width="320" height="210" rx="28" fill="#ffffff"/>
    <rect x="470" y="275" width="128" height="34" rx="17" fill="#7c3aed"/>
    <text class="pill" x="492" y="299">본인부담</text>
    <text class="card-num" x="470" y="360">95%</text>
    <text class="card-title" x="470" y="405">급여지만 고부담</text>
    <text class="note" x="470" y="438">가격 표준화에 가까운 변화</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="808" y="245" width="320" height="210" rx="28" fill="#ffffff"/>
    <rect x="838" y="275" width="92" height="34" rx="17" fill="#059669"/>
    <text class="pill" x="862" y="299">횟수</text>
    <text class="card-num" x="838" y="360">연 15회</text>
    <text class="card-title" x="838" y="405">주 2회 원칙</text>
    <text class="note" x="838" y="438">수술·골절 등 예외 연 24회</text>
  </g>
  <g transform="translate(72 515)">
    <rect x="0" y="0" width="1056" height="64" rx="32" fill="#10233f" opacity="0.92"/>
    <text class="pill" x="34" y="41">실손보험은 치료 목적·기준 횟수·약관에 따라 확인 필요</text>
  </g>
</svg>
