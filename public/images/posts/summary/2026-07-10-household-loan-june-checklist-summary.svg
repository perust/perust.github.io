<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">6월 가계대출 체크 요약</title>
  <desc id="desc">6월 전 금융권 가계대출 8.3조 원 증가와 이번 주 점검 항목을 정리한 lentoludens summary 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="180" fill="#38bdf8" opacity="0.12"/>
  <circle cx="120" cy="560" r="220" fill="#2dd4bf" opacity="0.10"/>

  <text x="72" y="78" fill="#a7f3d0" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="700">lentoludens summary</text>
  <text x="72" y="150" fill="#ffffff" font-size="48" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">6월 가계대출 8.3조 증가</text>
  <text x="72" y="205" fill="#dbeafe" font-size="28" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="600">주담대·전세·환율을 같이 볼 주간</text>

  <g filter="url(#shadow)">
    <rect x="72" y="258" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.96"/>
    <text x="104" y="315" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">전 금융권</text>
    <text x="104" y="375" fill="#0f766e" font-size="54" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">+8.3조</text>
    <text x="104" y="420" fill="#475569" font-size="22" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">5월 +9.3조보다 축소</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="258" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.96"/>
    <text x="472" y="315" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">주택담보대출</text>
    <text x="472" y="375" fill="#2563eb" font-size="54" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">+4.5조</text>
    <text x="472" y="420" fill="#475569" font-size="22" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">5월 +4.0조보다 확대</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="808" y="258" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.96"/>
    <text x="840" y="315" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">이번 주 행동</text>
    <text x="840" y="365" fill="#0f172a" font-size="28" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">상환액 재계산</text>
    <text x="840" y="405" fill="#0f172a" font-size="28" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">전세 만기 확인</text>
  </g>

  <text x="72" y="535" fill="#e0f2fe" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">기준금리 2.50% · 원/달러 1,500원대 · 은행권 가계대출 +7.6조</text>
  <text x="72" y="580" fill="#bae6fd" font-size="18" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">자료: 금융위원회, 한국은행, 한국부동산원, Yahoo Finance 참고 시세</text>
</svg>
