<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">힉스필드와 힉스 보손 요약</title>
  <desc id="desc">우주 전체에 퍼진 힉스장, 입자의 질량, LHC에서 발견한 힉스 보손의 관계를 설명하는 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="0.55" stop-color="#10213f"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="43%" r="46%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="0.48" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .brand{font:700 24px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:.08em;fill:#93c5fd}
      .title{font:800 58px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#f8fafc}
      .sub{font:500 26px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#cbd5e1}
      .label{font:700 22px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#bfdbfe}
      .body{font:500 20px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#dbeafe}
      .small{font:500 16px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g opacity="0.34">
    <path d="M-20 430 C150 360 260 500 420 430 S720 350 900 430 S1080 505 1230 430" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-20 485 C150 415 260 555 420 485 S720 405 900 485 S1080 560 1230 485" fill="none" stroke="#818cf8" stroke-width="3"/>
    <path d="M-20 545 C150 475 260 615 420 545 S720 465 900 545 S1080 620 1230 545" fill="none" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <g transform="translate(76 70)">
    <text class="brand" x="0" y="0">LENTOLUDENS · SCIENCE</text>
    <text class="title" x="0" y="78">힉스필드란 무엇인가</text>
    <text class="sub" x="0" y="124">질량을 만드는 보이지 않는 장과 힉스 보손의 차이</text>
  </g>
  <g transform="translate(120 205)">
    <circle cx="480" cy="190" r="132" fill="#1d4ed8" opacity="0.16" filter="url(#blur)"/>
    <circle cx="480" cy="190" r="104" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 12" opacity="0.75"/>
    <circle cx="480" cy="190" r="48" fill="#38bdf8" opacity="0.22"/>
    <circle cx="480" cy="190" r="13" fill="#e0f2fe"/>
    <text class="label" x="416" y="196">힉스장</text>
    <g opacity="0.9">
      <circle cx="265" cy="115" r="16" fill="#fbbf24"/>
      <circle cx="710" cy="88" r="12" fill="#a7f3d0"/>
      <circle cx="670" cy="302" r="20" fill="#fda4af"/>
      <circle cx="300" cy="300" r="10" fill="#c4b5fd"/>
      <path d="M282 125 C340 150 378 172 431 184" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
      <path d="M699 98 C640 132 585 158 531 181" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.8"/>
      <path d="M651 294 C612 264 574 232 526 200" fill="none" stroke="#fda4af" stroke-width="3" opacity="0.8"/>
      <path d="M310 293 C360 250 394 220 433 198" fill="none" stroke="#c4b5fd" stroke-width="3" opacity="0.8"/>
    </g>
  </g>
  <g transform="translate(76 520)">
    <rect x="0" y="0" width="320" height="96" rx="20" fill="#0f172a" stroke="#334155"/>
    <text class="label" x="26" y="34">장</text>
    <text class="body" x="26" y="68">빈 공간에도 깔린 배경값</text>
    <rect x="360" y="0" width="320" height="96" rx="20" fill="#0f172a" stroke="#334155"/>
    <text class="label" x="386" y="34">질량</text>
    <text class="body" x="386" y="68">결합 세기에 따라 달라짐</text>
    <rect x="720" y="0" width="320" height="96" rx="20" fill="#0f172a" stroke="#334155"/>
    <text class="label" x="746" y="34">보손</text>
    <text class="body" x="746" y="68">힉스장의 양자적 들뜸</text>
  </g>
  <text class="small" x="76" y="646">CERN · ATLAS · CMS · Nobel Prize 자료를 바탕으로 정리</text>
</svg>
