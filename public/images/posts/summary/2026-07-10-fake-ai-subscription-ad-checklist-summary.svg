<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">가짜 AI 구독 결제 점검 요약</title>
  <desc id="desc">검색 광고로 위장한 가짜 AI 구독 피해를 줄이기 위한 결제와 계정 점검 항목을 정리한 lentoludens summary 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="190" fill="#fb7185" opacity="0.14"/>
  <circle cx="150" cy="545" r="230" fill="#60a5fa" opacity="0.12"/>

  <text x="72" y="78" fill="#fecaca" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="700">lentoludens summary</text>
  <text x="72" y="148" fill="#ffffff" font-size="48" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="850">가짜 AI 구독 광고 주의</text>
  <text x="72" y="204" fill="#e0e7ff" font-size="28" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="650">결제·구독·계정 보안을 오늘 확인</text>

  <g filter="url(#shadow)">
    <rect x="72" y="260" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.97"/>
    <text x="104" y="318" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">결제 내역</text>
    <text x="104" y="370" fill="#dc2626" font-size="34" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">낯선 반복 승인</text>
    <text x="104" y="414" fill="#475569" font-size="22" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">카드 앱에서 먼저 확인</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="260" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.97"/>
    <text x="472" y="318" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">구독 화면</text>
    <text x="472" y="370" fill="#4f46e5" font-size="34" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">다음 결제일</text>
    <text x="472" y="414" fill="#475569" font-size="22" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">Google Play·Apple 점검</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="808" y="260" width="320" height="190" rx="28" fill="#f8fafc" opacity="0.97"/>
    <text x="840" y="318" fill="#0f172a" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">계정 보안</text>
    <text x="840" y="370" fill="#0f766e" font-size="34" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">비밀번호·2단계</text>
    <text x="840" y="414" fill="#475569" font-size="22" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif">입력했을 가능성까지 대비</text>
  </g>

  <text x="72" y="535" fill="#c7d2fe" font-size="24" font-family="Noto Sans KR, Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="650">검색 광고 클릭 전 도메인과 결제 주체 확인</text>
</svg>
